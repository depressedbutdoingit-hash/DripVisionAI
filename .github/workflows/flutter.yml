name: DripVision Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Create CI env file
        run: |
          touch .env
          echo "OPENROUTER_KEY=${{ secrets.OPENROUTER_KEY }}" >> .env
          echo "FAL_AI_KEY=${{ secrets.FAL_AI_KEY }}" >> .env
          echo "OPENAI_KEY=${{ secrets.OPENAI_KEY }}" >> .env
          echo "ELEVENLABS_KEY=${{ secrets.ELEVENLABS_KEY }}" >> .env
          echo "SUNO_API_KEY=${{ secrets.SUNO_API_KEY }}" >> .env
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Test
        run: flutter test

  android-release-check:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Create CI env file
        run: touch .env
      - name: Bootstrap Gradle 8.14
  run: |
    curl -fsSL https://services.gradle.org/distributions/gradle-8.14-bin.zip -o /tmp/gradle.zip
    unzip -q /tmp/gradle.zip -d /tmp/gradle
    cd android
    /tmp/gradle/gradle-8.14/bin/gradle wrapper --gradle-version 8.14 --distribution-type bin
      - name: Build Android APK
        run: flutter build apk --release
      - name: Build Android APK
        run: flutter build apk --release
